name: ci
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
      # controls the action repo can repoint v4 at new code, which then runs
      # here with a GITHUB_TOKEN. This is the same reasoning that pins installed
      # agents to a SHA — see memory/decisions/agent-pinning.md. The trailing
      # comment records which release each SHA is, so upgrades stay legible.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # full history so gitleaks can scan commits

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      # Toolchain pinned in requirements-dev.txt — an unpinned `--with ruff`
      # resolves the newest release on every run, and ruff's default rule set
      # moving once turned this job red with findings no commit introduced.
      - name: Lint (ruff)
        run: uv run --with-requirements requirements-dev.txt --no-project ruff check scripts tests hooks skills

      - name: Unit tests (pytest)
        run: uv run --with-requirements requirements-dev.txt --no-project pytest -q tests

      - name: Self-check (JSON, agent scan, init engine, memory index, tests)
        run: uv run --no-project python scripts/selfcheck.py

      - name: Init engine smoke (--plan, no writes)
        run: |
          uv run --no-project python scripts/init_project.py --plan \
            --build web --rigor production --touches api-keys,money --stack react --name ci-web
          uv run --no-project python scripts/init_project.py --plan \
            --build mcp-server --rigor product --touches none --name ci-mcp

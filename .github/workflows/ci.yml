name: ci
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
      # controls the action repo can repoint v4 at new code, which then runs
      # here with a GITHUB_TOKEN. This is the same reasoning that pins installed
      # agents to a SHA — see memory/decisions/agent-pinning.md. The trailing
      # comment records which release each SHA is, so upgrades stay legible.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history so gitleaks can scan commits

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Toolchain pinned in requirements-dev.txt — an unpinned `--with ruff`
      # resolves the newest release on every run, and ruff's default rule set
      # moving once turned this job red with findings no commit introduced.
      - name: Lint (ruff)
        run: uv run --with-requirements requirements-dev.txt --no-project ruff check scripts tests hooks skills

      - name: Unit tests (pytest)
        run: uv run --with-requirements requirements-dev.txt --no-project pytest -q tests

      - name: Self-check (JSON, agent scan, init engine, memory index, tests)
        run: uv run --no-project python scripts/selfcheck.py

      - name: Init engine smoke (--plan, no writes)
        run: |
          uv run --no-project python scripts/init_project.py --plan \
            --build web --rigor production --touches api-keys,money --stack react --name ci-web
          uv run --no-project python scripts/init_project.py --plan \
            --build mcp-server --rigor product --touches none --name ci-mcp

      # The step above proves the init *engine* works; it writes nothing, so the
      # templates themselves were never exercised. This scaffolds each one for
      # real into a temp dir and runs its own build+test — the "verified green
      # baseline" rule the ecosystem applies to projects it creates, applied to
      # the blueprints those projects are made from.
      - name: Templates still scaffold into a green project
        run: uv run --no-project python scripts/verify_templates.py

      # The flagship command, end to end for the first time. It used to write a
      # memory card, a MOC line and a registry mutation into the repo no matter
      # what, so running it once dirtied the checkout and it was never in CI —
      # which is how a Windows crash in its own baseline step survived unnoticed.
      # ECOSYSTEM_VAULT + --skip-agents make it leave nothing behind.
      - name: Init --apply, end to end (sandboxed vault, no agent installs)
        env:
          ECOSYSTEM_DEST_ROOT: ${{ runner.temp }}/eco-projects
          ECOSYSTEM_VAULT: ${{ runner.temp }}/eco-vault
        run: |
          mkdir -p "$ECOSYSTEM_DEST_ROOT" "$ECOSYSTEM_VAULT"
          # A fresh runner has no git identity, and `scaffold --git` makes an
          # initial commit. Setting one here exercises the full path; the
          # missing-identity path is covered by tests instead.
          git config --global user.name  "ecosystem-brain ci"
          git config --global user.email "ci@example.invalid"
          uv run --no-project python scripts/init_project.py --apply \
            --build cli --rigor prototype --touches none --name ci-apply --skip-agents
          test -f "$ECOSYSTEM_VAULT/projects/ci-apply.md"
          test -f "$ECOSYSTEM_DEST_ROOT/ci-apply/AGENTS.md"
          git diff --exit-code   # the repo must be untouched
